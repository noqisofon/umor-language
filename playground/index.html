<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Umor Playground</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        margin: 0 auto;
        padding: 1.5rem;
        max-width: 48rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      textarea {
        width: 100%;
        min-height: 10rem;
        box-sizing: border-box;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.95rem;
        padding: 0.5rem;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.4rem 1.2rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      pre {
        margin-top: 0.5rem;
        min-height: 6rem;
        padding: 0.5rem;
        background: rgba(127, 127, 127, 0.12);
        border-radius: 4px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .hint {
        font-size: 0.85rem;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
